name: Build.deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # Ici tu crées la structure Debian et le .deb
      - name: Prepare Debian package structure
        run: |
          APP_NAME="assistant-ia"
          VERSION="1.0.0"
          PKG_DIR="${APP_NAME}_${VERSION}"

          mkdir -p "$PKG_DIR/DEBIAN"
          mkdir -p "$PKG_DIR/usr/local/bin"

          # Copie ton binaire/script
          # ex: cp path/to/assistant-ia "$PKG_DIR/usr/local/bin/assistant-ia"
          echo '#!/bin/bash' > "$PKG_DIR/usr/local/bin/assistant-ia"
          echo 'echo "Assistant-IA running"' >> "$PKG_DIR/usr/local/bin/assistant-ia"
          chmod +x "$PKG_DIR/usr/local/bin/assistant-ia"

          cat <<EOF > "$PKG_DIR/DEBIAN/control"
          Package: ${APP_NAME}
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Your Name <you@example.com>
          Description: Assistant-IA
           Assistant-IA CLI/launcher.
          EOF

      - name: Build .deb
        run: |
          APP_NAME="assistant-ia"
          VERSION="1.0.0"
          PKG_DIR="${APP_NAME}_${VERSION}"
          dpkg-deb --build "$PKG_DIR"
          mkdir -p dist
          mv "${PKG_DIR}.deb" "dist/${APP_NAME}_${VERSION}_amd64.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: assistant-ia-deb
          path: dist/*.deb
